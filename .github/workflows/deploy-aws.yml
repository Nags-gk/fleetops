name: Deploy to AWS

# Manual. Add repository secrets first:
#   AWS_DEPLOY_ROLE_ARN  (preferred, GitHub OIDC role)  or  AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
#   ALERT_EMAIL          (optional) on-call email for pages, alarms and the $5 budget alert
# The ingest and operator keys are generated in AWS Secrets Manager by the stack itself.
on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region
        default: us-east-2

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws
    env:
      HAS_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: corretto, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: AWS credentials (OIDC role)
        if: env.HAS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - name: AWS credentials (access keys)
        if: env.HAS_ROLE != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}
      - run: mvn -B -q package -DskipTests
      - working-directory: infra
        run: |
          npm ci
          npx tsc
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ARGS=""
          [ -n "${{ secrets.ALERT_EMAIL }}" ] && ARGS="-c alertEmail=${{ secrets.ALERT_EMAIL }}"
          npx cdk bootstrap aws://$ACCOUNT/${{ inputs.region }} $ARGS
          npx cdk deploy FleetOps --require-approval never --outputs-file outputs.json $ARGS
          cat outputs.json
