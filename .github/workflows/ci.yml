name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  java:
    name: Java 21 build, unit + AWS integration tests (moto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start local AWS emulator (DynamoDB, SQS, SNS)
        run: |
          pip install "moto[server]"
          nohup moto_server -p 5055 > moto.log 2>&1 &
          sleep 3
      - run: mvn -B verify
        env:
          MOTO_ENDPOINT: http://localhost:5055
      - name: Re-score the detector on the simulated fleet
        run: mvn -B -q exec:java -Dexec.args="evaluate 100 60 42"
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-jar
          path: target/fleetops-0.1.0.jar

  infra:
    name: CDK (TypeScript) tests and synth
    runs-on: ubuntu-latest
    needs: java
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: lambda-jar
          path: target
      - run: npm ci
      - run: npm test
      - run: npx cdk synth -c ingestKey=ci-only -q

  pages:
    name: Deploy dashboard to GitHub Pages
    needs: [java, infra]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site
          cp -r web/* site/
          cp results/detector_eval.json site/data/
          touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
